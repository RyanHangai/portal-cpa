services:
  app:
    image: python:3.14
    working_dir: /app
    build:
      context: .
      dockerfile: .docker/app.dev.dockerfile
    volumes:
      - ./:/app
      - pip-cache:/root/.cache/pip
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://postgres:postgres@db:5432/bd-portal
      GOOSE_MIGRATION_DIR: /app/database/database.sql
    ports:
      - "8002:8501"

  postgres:
    image: postgres:18
    container_name: portal-cpa-postgres
    environment:
      POSTGRES_DB: bd-portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8001:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
  pip-cache:
